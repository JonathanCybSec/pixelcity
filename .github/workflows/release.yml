name: Exécutable Windows
# Construit PixelCity.exe sur Windows et publie la Release de la version du pyproject.

on:
  push:
    tags: ["v*"]
    branches: [etape-2-ville-visible, etape-3-conversations, etape-4-studio, etape-5-memoire, etape-6-economie-transports, etape-6b-vraie-vie]
    paths: [".github/workflows/release.yml", "packaging/**", "pixelcity/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Construire PixelCity.exe
        run: >
          pyinstaller --noconfirm --onedir --windowed --name PixelCity
          --paths .
          --add-data "pixelcity/config;pixelcity/config"
          --add-data "pixelcity/assets;pixelcity/assets"
          --collect-submodules pixelcity
          packaging/launcher.py
      - name: Test de fumée
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          $p = Start-Process dist/PixelCity/PixelCity.exe -ArgumentList "--headless","--days","0.1","--quiet","--no-llm" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Zipper
        shell: pwsh
        run: |
          Copy-Item README.md, CREDITS.md, .env.example dist/PixelCity/
          Compress-Archive -Path dist/PixelCity -DestinationPath PixelCity-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PixelCity-Windows
          path: PixelCity-Windows.zip
      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          V="v$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          gh release delete "$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$V" PixelCity-Windows.zip --target "$GITHUB_SHA" --title "PixelCity $V" --notes "Dézippe, puis double-clique sur PixelCity\PixelCity.exe. Pour les conversations par IA : installe Ollama puis ollama pull qwen2.5:3b."
