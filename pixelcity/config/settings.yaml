# Réglages généraux de la simulation.
# Les heures s'écrivent TOUJOURS entre guillemets : "07:30".

# Graine maîtresse : même graine => même simulation, à l'identique.
seed: 42

time:
  # 1 tick = 10 secondes simulées (8 640 ticks par jour).
  tick_seconds: 10
  # Durée réelle d'une journée simulée à la vitesse x1 : 24 minutes, soit
  # 1 minute simulée par seconde. C'est la vitesse « lecture » : on a le temps
  # de voir quelqu'un sortir le beurre du frigo et de lire les bulles.
  real_minutes_per_day: 24
  # Vitesses accessibles avec les touches 1 à 4.
  speeds: [1, 3, 10, 30]
  # Protection anti « spirale de la mort » : au-delà, la simulation ralentit
  # au lieu de geler la fenêtre.
  max_ticks_per_frame: 500

window:
  width: 1280
  height: 720
  fps: 60
  start_zoom: 3

# Vitesse de marche, en tuiles par minute simulée. Bien plus lent que la
# réalité (une tuile ≈ 1 m) : c'est voulu, pour qu'on voie les trajets.
walk_speed_tiles_per_minute: 4.0

# Jauges de 0 à 100 (100 = besoin parfaitement satisfait).
# - decay_per_hour : baisse naturelle par heure simulée
# - critical       : en dessous, l'agent interrompt son plan pour y remédier
# - satisfied      : au-dessus, il considère le besoin comblé (hystérésis)
# Les gains (manger, dormir, se laver...) sont portés par les étapes des
# recettes, dans actions.yaml.
needs:
  hunger:  {decay_per_hour: 6.0, critical: 20, satisfied: 90, initial: 75}
  energy:  {decay_per_hour: 4.0, critical: 12, satisfied: 85, initial: 80}
  hygiene: {decay_per_hour: 2.5, critical: 15, satisfied: 90, initial: 80}
  bladder: {decay_per_hour: 14.0, critical: 18, satisfied: 90, initial: 70}
  fun:     {decay_per_hour: 3.0, critical: 10, satisfied: 80, initial: 70}

# Marcher fatigue un peu.
walking_effects: {energy: -1}

# Étape 6 : l'argent. Les prix sont dans actions.yaml (items), les loyers
# dans city.yaml, les salaires dans agents.yaml.
economy:
  tight_budget: 40     # en dessous : pas de déjeuner dehors ni de café
  comfortable: 400     # au-dessus : « à l'aise » (dit au LLM)

# Étape 6 : une ligne de bus sur l'avenue, d'ouest en est et retour.
transit:
  buses: 3
  speed_tiles_per_minute: 30   # 7 à 8 fois la marche
  dwell_minutes: 0.5           # arrêt à chaque station
  ticket: 1.5
  min_walk_tiles: 45           # en dessous, on marche
