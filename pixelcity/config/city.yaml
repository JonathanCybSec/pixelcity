# Les lieux de la ville et leurs règles.
#
# La GÉOGRAPHIE (murs, portes, meubles) vit dans la carte Tiled générée par
# tools/make_city.py ; ce fichier décrit les RÈGLES (horaires, capacité,
# activités). Les deux sont reliés par `id` = propriété `place_id` dans Tiled.
#
# - activities       : ce que tout le monde peut faire ici, aux heures d'ouverture
# - staff_activities : réservé aux employés, à toute heure
# - hours            : "always" ou "HH:MM-HH:MM" (une plage peut passer minuit)
#
# Les horaires des commerces suivent ceux de leurs employés (agents.yaml) :
# sans vendeur derrière le comptoir, personne n'est servi.

map: city.tmx

places:
  # --- Résidentiel -------------------------------------------------------
  - {id: maison_dupont, name: Maison Dupont, kind: home, capacity: 4, hours: always, activities: [sleep, eat, hygiene, toilet, relax], rent: 28}
  - {id: maison_benali, name: Maison Benali, kind: home, capacity: 5, hours: always, activities: [sleep, eat, hygiene, toilet, relax], rent: 28}
  - {id: maison_girard, name: Maison Girard, kind: home, capacity: 4, hours: always, activities: [sleep, eat, hygiene, toilet, relax], rent: 28}
  - {id: maison_lilas, name: Maison des Lilas, kind: home, capacity: 4, hours: always, activities: [sleep, eat, hygiene, toilet, relax], rent: 28}
  - {id: appart_1, name: Appartement 1 (Tilleuls), kind: home, capacity: 3, hours: always, activities: [sleep, eat, hygiene, toilet, relax], rent: 20}
  - {id: appart_2, name: Appartement 2 (Tilleuls), kind: home, capacity: 3, hours: always, activities: [sleep, eat, hygiene, toilet, relax], rent: 20}
  - {id: appart_3, name: Appartement 3 (Tilleuls), kind: home, capacity: 3, hours: always, activities: [sleep, eat, hygiene, toilet, relax], rent: 20}
  # Quartier des Mimosas (étape 6), à l'est de la troisième rue.
  - {id: mimosas_1, name: Mimosas 1, kind: home, capacity: 3, hours: always, activities: [sleep, eat, hygiene, toilet, relax], rent: 16}
  - {id: mimosas_2, name: Mimosas 2, kind: home, capacity: 3, hours: always, activities: [sleep, eat, hygiene, toilet, relax], rent: 16}
  - {id: mimosas_3, name: Mimosas 3, kind: home, capacity: 3, hours: always, activities: [sleep, eat, hygiene, toilet, relax], rent: 16}
  - {id: mimosas_4, name: Mimosas 4, kind: home, capacity: 3, hours: always, activities: [sleep, eat, hygiene, toilet, relax], rent: 16}
  - {id: mimosas_5, name: Mimosas 5, kind: home, capacity: 3, hours: always, activities: [sleep, eat, hygiene, toilet, relax], rent: 16}
  - {id: mimosas_6, name: Mimosas 6, kind: home, capacity: 3, hours: always, activities: [sleep, eat, hygiene, toilet, relax], rent: 16}

  # --- Commerces ----------------------------------------------------------
  - id: boulangerie
    name: Boulangerie du Coin
    kind: bakery
    capacity: 10
    hours: "06:30-13:00"
    days: [mon, tue, wed, thu, fri, sat]
    activities: [eat]
    staff_activities: [work, toilet]
    jobs: 2  # postes
    employer: "Boulangerie du Coin"
    external_revenue: 40  # € par heure : la clientèle qu'on ne simule pas

  - id: cafe
    name: Café des Arts
    kind: cafe
    capacity: 20
