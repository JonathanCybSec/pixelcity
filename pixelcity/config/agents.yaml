# Les habitants.
#
# Toute la fiche est déjà là (personnalité, valeurs), même si l'étape 1 n'en
# exploite qu'une partie : à l'étape 2, ces informations nourriront les
# prompts du LLM qui planifiera leurs journées.
#
# personality : Big Five (OCEAN), chaque trait entre 0 et 1.
# Les heures s'écrivent entre guillemets.

agents:
